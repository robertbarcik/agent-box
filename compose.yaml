# agent-box: one coding agent, two guarded doors, no other way out.
#
#   agent    the coding agent (opencode). Lives only on the "inside" network,
#            which has no route to the internet or to your home network.
#   gateway  door 1: forwards model calls to OpenRouter and adds the API key.
#   egress   door 2: forward proxy that lets through only the domains in
#            egress/allowlist.txt (empty by default).

name: agent-box

services:
  agent:
    build:
      context: ./agent
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.19.5}
    image: agent-box/agent
    init: true
    command: ["sleep", "infinity"]
    user: agent
    working_dir: /workspace
    environment:
      # Not a real key. The gateway swaps in the real one on the way out.
      OPENROUTER_API_KEY: held-by-the-gateway
      BOX_MODEL: ${BOX_MODEL:-openrouter/z-ai/glm-5.3}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: gateway,localhost,127.0.0.1
      no_proxy: gateway,localhost,127.0.0.1
    volumes:
      # These three folders are everything of your computer the agent can see.
      - ./workspaces/${BOX_WORKSPACE:-default}:/workspace   # the project it works on
      - ./inbox:/inbox:ro                                    # you drop things in; it can only read
      - ./outbox:/outbox                                     # it leaves things for you
      # The agent's own home (sessions, caches). Lives in Docker, not on your disk. One per workspace.
      - home:/home/agent
    tmpfs:
      - /tmp:exec,size=1g
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${BOX_MEMORY:-4g}
    cpus: ${BOX_CPUS:-4}
    networks: [inside]
    depends_on: [gateway, egress]

  gateway:
    build: ./gateway
    image: agent-box/gateway
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The guard lets through calls to this model only (plus BOX_EXTRA_MODELS, if you set it).
      BOX_MODEL: ${BOX_MODEL:-openrouter/z-ai/glm-5.3}
      BOX_EXTRA_MODELS: ${BOX_EXTRA_MODELS:-}
    volumes:
      # The guards write their logbooks here. The agent cannot see this folder.
      - ./logs:/box-logs
      # The web-search switch, written by bin/box on the host (box run --web).
      - ./.box/policy:/box-policy:ro
    # The guard faces the agent, so it gets the same treatment: nothing to write to, no powers.
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]   # to append to logs/ on Linux, where that folder belongs to you
    security_opt:
      - no-new-privileges:true
    networks: [inside, outside]
    restart: unless-stopped

  egress:
    build: ./egress
    image: agent-box/egress
    volumes:
      # The folder, not the single file: editors replace a file when saving,
      # and a single-file mount would keep pointing at the old one.
      - ./egress:/box-egress:ro
      - ./logs:/box-logs
    networks: [inside, outside]
    restart: unless-stopped

networks:
  # internal: true = Docker gives this network no gateway to the outside world.
  inside:
    internal: true
  outside: {}

volumes:
  # One home per workspace: what the agent leaves in its home while working on one project
  # (settings, notes to its future self) is not there when it works on the next.
  home:
    name: agent-box_home_${BOX_WORKSPACE:-default}
