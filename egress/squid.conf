# The egress proxy is the box's only route to the general internet.
# Rule: a destination is reachable only if its domain is in allowlist.txt.
# With an empty allowlist the box has no internet at all.

http_port 3128

acl allowed dstdomain "/box-egress/allowlist.txt"
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access allow allowed
http_access deny all

# A proxy, not a cache.
cache deny all

# One line per request: time, verdict/status, method, destination, bytes sent back.
logformat box %{%Y-%m-%dT%H:%M:%S}tl %Ss/%>Hs %rm %ru bytes=%<st
access_log stdio:/var/log/squid/access.log box
cache_log /var/log/squid/cache.log

# Do not tell destinations who is asking.
forwarded_for delete

pid_filename /run/squid/squid.pid
shutdown_lifetime 1 seconds
